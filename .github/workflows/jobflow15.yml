name: JobFlow 15 validation
on:
  push:
    branches: [feature/us-chicago-job-targeting]
  pull_request:
    paths:
      - 'scripts/jobflow*.mjs'
      - 'tests/jobflow*.test.mjs'
      - '.github/workflows/jobflow15.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/jobflow30-shortlist.mjs
      - run: node --check scripts/jobflow30-evidence.mjs
      - run: node --check scripts/jobflow15-outreach.mjs
      - run: node --check scripts/jobflow15-message.mjs
      - run: node --check scripts/jobflow15-pipeline.mjs
      - run: node --test tests/jobflow30-shortlist.test.mjs tests/jobflow15-outreach.test.mjs tests/jobflow15-message.test.mjs tests/jobflow15-pipeline.test.mjs
